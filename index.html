function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }

// หา fixed ของเดือนก่อนหน้า (ย้อนไปได้สูงสุด 12 เดือน)
function getPrevFixed(year, month) {
  for(let i=1;i<=12;i++){
    let y=year, m=month-i;
    while(m<1){m+=12;y--;}
    const k=`raijai_${y}-${String(m).padStart(2,"0")}`;
    const d=lsGet(k);
    if(d?.fixedExpenses?.length) return d.fixedExpenses;
  }
  return DEFAULT_FIXED;
}

function Editable({ value, onSave, prefix="", isText=false, style={} }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  useEffect(()=>setVal(value),[value]);
  const save = () => { const v=isText?String(val).trim():Number(val); if(isText?v:!isNaN(v)) onSave(v); setEditing(false); };
  if(editing) return (
    <input autoFocus type={isText?"text":"number"} value={val}
      onChange={e=>setVal(e.target.value)} onBlur={save}
      onKeyDown={e=>{ if(e.key==="Enter") save(); if(e.key==="Escape") setEditing(false); }}
      style={{border:"1.5px solid #1B4332",borderRadius:6,padding:"2px 6px",fontFamily:"'Sarabun',sans-serif",
        fontSize:"inherit",fontWeight:"inherit",color:"#1B4332",width:isText?120:90,outline:"none",background:"#F0FDF4",...style}}/>
  );
  return <span onClick={()=>setEditing(true)} title="แตะเพื่อแก้ไข"
    style={{cursor:"pointer",borderBottom:"1.5px dashed #B7E4C7",paddingBottom:1,...style}}>
    {prefix}{isText?value:fmt(value)}
  </span>;
}

    const html = document.documentElement;
    const prev = {
      position: body.style.position, top: body.style.top, width: body.style.width,
      overflow: body.style.overflow, touchAction: body.style.touchAction,
      htmlOverflow: html.style.overflow
    };
    body.style.position = "fixed";
    body.style.top = `-${scrollY}px`;
    body.style.width = "100%";
    body.style.overflow = "hidden";
    body.style.touchAction = "none";
    html.style.overflow = "hidden";
    return () => {
      body.style.position = prev.position;
      body.style.top = prev.top;
      body.style.width = prev.width;
      body.style.overflow = prev.overflow;
      body.style.touchAction = prev.touchAction;
      html.style.overflow = prev.htmlOverflow;
      window.scrollTo(0, scrollY);
    };
  }, [modal]);

  const mk = (y,m) => `raijai_${y}-${String(m).padStart(2,"0")}`;
  const monthKey = mk(year,month);

  const validSyncUrl = url => /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test(String(url||"").trim());
  const cloudPost = async (key, data, url=syncUrl) => {
    const endpoint=String(url||"").trim();
    if(!validSyncUrl(endpoint)) return false;
    try{
      const payload={action:"save",key,data,updatedAt:Number(data?._updatedAt)||Date.now()};
      const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),redirect:"follow"});
      const j=await r.json();
      return !!j?.ok;
    }catch(err){ console.warn("cloud save failed",err); return false; }
  };

  const collectLocalRecords = () => {
    const records={};
    const cfg=lsGet("raijai_config"); if(cfg) records.raijai_config=cfg;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith("raijai_20")){ const v=lsGet(k); if(v) records[k]=v; }
    }
    return records;
  };

  const syncNow = async (url=syncUrl, quiet=false) => {
    const endpoint=String(url||"").trim();
    if(!validSyncUrl(endpoint)){ if(!quiet) setSyncStatus("❌ URL Apps Script ไม่ถูกต้อง"); setSyncReady(true); return; }
    setSyncBusy(true); if(!quiet) setSyncStatus("กำลังซิงก์…");
    let shouldReload=false;
    try{
      const r=await fetch(endpoint+(endpoint.includes("?")?"&":"?")+"action=load&_="+Date.now(),{redirect:"follow",cache:"no-store"});
      const j=await r.json(); if(!j?.ok) throw new Error(j?.error||"load failed");
      const remote=j.records||{}; const local=collectLocalRecords(); let changed=false; let pushed=0; let pulled=0;
      const keys=new Set([...Object.keys(local),...Object.keys(remote)]);
      for(const key of keys){
        let lv=local[key]; const rr=remote[key];
        let lt=Number(lv?._updatedAt)||0; const rt=Number(rr?.updatedAt)||Number(rr?.data?._updatedAt)||0;
        if(!rr && lv){
          if(!lt){ lv={...lv,_updatedAt:Date.now()}; lsSet(key,lv); lt=lv._updatedAt; }
          if(await cloudPost(key,lv,endpoint)) pushed++;
        }else if(rr && !lv){
          lsSet(key,{...(rr.data||{}),_updatedAt:rt||Date.now()}); changed=true; pulled++;
        }else if(rr && lv){
          if(rt>lt || (rt>0 && lt===0)){
            lsSet(key,{...(rr.data||{}),_updatedAt:rt}); changed=true; pulled++;
          }else if(lt>rt){
            if(await cloudPost(key,lv,endpoint)) pushed++;
          }
        }
      }
      setSyncStatus(`✅ ซิงก์สำเร็จ${pulled?` • ดึง ${pulled}`:""}${pushed?` • อัป ${pushed}`:""}`);
      if(changed){ shouldReload=true; location.reload(); }
    }catch(err){ console.warn(err); setSyncStatus("❌ ซิงก์ไม่สำเร็จ ตรวจ URL / สิทธิ์ Web App / อินเทอร์เน็ต"); }
    finally{ setSyncBusy(false); if(!shouldReload) setSyncReady(true); }
  };

  const saveSyncUrl = () => {
    const u=String(syncUrl||"").trim();
    if(!validSyncUrl(u)){ setSyncStatus("❌ วาง URL ที่ลงท้าย /exec จาก Google Apps Script"); return; }
    localStorage.setItem("raijai_sync_url",u); setSyncUrl(u); setSyncStatus("✅ บันทึก URL แล้ว กด ‘ซิงก์ตอนนี้’ ได้เลย");
  };

  // เปิดเว็บให้แสดงข้อมูลจาก localStorage ทันที แล้วค่อยดึง Google Sheets เบื้องหลัง
  useEffect(()=>{
    const u=localStorage.getItem("raijai_sync_url")||"";
    if(validSyncUrl(u)) setTimeout(()=>syncNow(u,true),50);
  },[]);

  // โหลดข้อมูลจากเครื่องทันที ไม่ต้องรอ Google Sync รอบแรก
  useEffect(()=>{
    if(!syncReady) return;
    const cfg = lsGet("raijai_config");
    if(cfg?.income)     setIncome(cfg.income);
    if(cfg?.savingGoal) setSavingGoal(cfg.savingGoal);
    if(cfg?.monthlyBudget != null) setMonthlyBudget(cfg.monthlyBudget);

    const md = lsGet(monthKey);
    if(md){
      // เดือนเก่า — โหลดข้อมูลที่มีอยู่
      setFixed(md.fixedExpenses || DEFAULT_FIXED);
      setDaily(md.daily || {});
      setPaid(md.paid   || {});
      setIsNewMonth(false);
    } else {
      // เดือนใหม่ — copy รายจ่ายประจำจากเดือนก่อนเป็น starting point
      // แล้วบันทึกเป็นข้อมูลของเดือนนี้ทันที เพื่อให้แต่ละเดือนแยกอิสระจากกัน
      const prevFixed = getPrevFixed(year, month);
      const copiedFixed = prevFixed.map(e => ({ ...e }));

      setFixed(copiedFixed);
      setDaily({});
      setPaid({});
      setIsNewMonth(true);

      // สร้าง snapshot ของเดือนใหม่ทันที
      // หลังจากนี้แก้ไขเดือนนี้จะไม่ไปดึง/เปลี่ยนตามเดือนก่อนอีก
      const fresh={fixedExpenses:copiedFixed,daily:{},paid:{},_updatedAt:Date.now()};
      lsSet(monthKey,fresh);
      queueCloudSave(monthKey,fresh);
    }
  },[monthKey,syncReady]);

  useEffect(()=>{
    if(!syncReady || tab!=="overview") return;
    const res={};
    for(let m=1;m<=12;m++){
      const k=mk(ovYear,m);
      res[k]=lsGet(k)||{fixedExpenses:[],daily:{},paid:{}};
    }
    setAllMonthData(res);
  },[tab,ovYear,syncReady]);

  // บันทึกข้อมูลเดือนปัจจุบัน
  const queueCloudSave = (key, data) => {
    if(!validSyncUrl(syncUrl)) return;
    // localStorage ถูกบันทึกก่อนเสมอ ส่วน Google Sheets ส่งแบบเบื้องหลัง
    clearTimeout(syncTimerRef.current);
    syncPendingRef.current = true;
    syncTimerRef.current = setTimeout(async ()=>{
      if(syncInFlightRef.current) return;
      syncInFlightRef.current = true;
      syncPendingRef.current = false;
      setSyncStatus("กำลังซิงก์…");
      try{
        const ok = await cloudPost(key,data);
        if(ok) setSyncStatus("✅ ซิงก์แล้ว");
      } finally {
        syncInFlightRef.current = false;
      }
    },800);
  };

  const saveMonth = (fixed, daily, paid) => {
    const data={
      fixedExpenses: fixed ?? fixedExpenses,
      daily: daily ?? dailyEntries,
      paid:  paid  ?? paidFixed,
      _updatedAt: Date.now(),
    };
    lsSet(monthKey,data);
    queueCloudSave(monthKey,data);
    setIsNewMonth(false);
  };
  const exportBackup = () => {
    const data = { app:"บันทึกรายจ่าย", version:1, exportedAt:new Date().toISOString(), config:lsGet("raijai_config")||{income,savingGoal,monthlyBudget}, months:{} };
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith("raijai_20")){ const v=lsGet(k); if(v) data.months[k]=v; } }
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a");
    const d=new Date(); const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    a.href=url; a.download=`backup-รายจ่าย-${stamp}.json`; a.click(); URL.revokeObjectURL(url);
  };
  const importBackup = file => {
    if(!file) return; const reader=new FileReader();
    reader.onload=e=>{ try{ const data=JSON.parse(e.target.result); if(!data||data.app!=="บันทึกรายจ่าย"||typeof data.months!=="object") throw new Error("invalid");
      if(!confirm("นำเข้าข้อมูลสำรองจะเขียนทับข้อมูลรายจ่ายที่มีอยู่ในเครื่องนี้ ต้องการดำเนินการต่อหรือไม่?")) return;
      const keys=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k==="raijai_config"||(k&&k.startsWith("raijai_20"))) keys.push(k);} keys.forEach(k=>localStorage.removeItem(k));
      const stamp=Date.now();
      if(data.config) lsSet("raijai_config",{...data.config,_updatedAt:stamp});
      Object.entries(data.months).forEach(([k,v],i)=>lsSet(k,{...v,_updatedAt:stamp+i+1}));
      alert("นำเข้าข้อมูลสำเร็จแล้ว หากเปิด Google Sync อยู่ ให้กด ‘ซิงก์ตอนนี้’ เพื่ออัปข้อมูลชุดนี้"); location.reload();
    }catch(err){alert("ไฟล์สำรองไม่ถูกต้อง หรือไฟล์เสียหาย");} }; reader.readAsText(file);
  };

  const saveConfig = (inc, goal) => {
    const data={income:inc??income,savingGoal:goal??savingGoal,monthlyBudget:monthlyBudget,_updatedAt:Date.now()};
    lsSet("raijai_config",data); queueCloudSave("raijai_config",data);
  };

  const totalFixed = fixedExpenses.reduce((s,e)=>s+e.amount,0);
  const totalVar   = Object.values(dailyEntries).flat().reduce((s,i)=>s+Number(i.amount),0);
  const totalExp   = totalFixed+totalVar;
  const remaining  = income-totalExp;
  const savings    = Math.max(0,remaining);
  const goalPct    = savingGoal>0?Math.min(100,(savings/savingGoal)*100):0;
  const varBudget  = Math.max(0,monthlyBudget-totalFixed);
  const budgetRemaining = monthlyBudget-totalExp;
  const budgetPct = monthlyBudget>0 ? Math.min(100,(totalExp/monthlyBudget)*100) : 0;

  const prevMonth = ()=>{ if(month===1){setMonth(12);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth = ()=>{ if(month===12){setMonth(1);setYear(y=>y+1);}else setMonth(m=>m+1); };

  const addDaily = ()=>{
    if(!fDay||!fName.trim()||!fAmt) return false;
    const upd={...dailyEntries,[fDay]:[...(dailyEntries[fDay]||[]),{id:mkid(),name:fName.trim(),amount:Number(fAmt),category:fCategory,note:fNote.trim()}]};
    setDaily(upd); saveMonth(null,upd,null); setFName(""); setFAmt(""); setFNote(""); setFCategory(CATEGORIES[0]); setExpDay(fDay);
    setTimeout(()=>dailyNameRef.current?.focus(),0);
    return true;
  };
  const addFixed = ()=>{
    if(!fxName.trim()||!fxAmt) return;
    const nf=[...fixedExpenses,{id:mkid(),name:fxName.trim(),amount:Number(fxAmt)}];
    setFixed(nf); saveMonth(nf,null,null); setFxName(""); setFxAmt("");
  };
  const delDaily = (day,idx)=>{
    const removed=dailyEntries[day]?.[idx];
    const upd={...dailyEntries,[day]:dailyEntries[day].filter((_,i)=>i!==idx)};
    if(!upd[day].length) delete upd[day];
    setLastDeleted({type:"daily",day,idx,item:removed});
    setDaily(upd); saveMonth(null,upd,null);
  };
  const duplicateDaily = (day,idx)=>{
    const src=dailyEntries[day]?.[idx]; if(!src) return;
    const copy={...src,id:mkid()};
    const upd={...dailyEntries,[day]:[...(dailyEntries[day]||[]),copy]};
    setDaily(upd); saveMonth(null,upd,null); setExpDay(day);
  };
  const delFixed   = id=>{ const removed=fixedExpenses.find(e=>e.id===id); const nf=fixedExpenses.filter(e=>e.id!==id); setLastDeleted({type:"fixed",item:removed}); setFixed(nf); saveMonth(nf,null,null); };
  const undoDelete = ()=>{
    if(!lastDeleted) return;
    if(lastDeleted.type==="daily"){ const {day,idx,item}=lastDeleted; const arr=[...(dailyEntries[day]||[])]; arr.splice(Math.min(idx,arr.length),0,item); const upd={...dailyEntries,[day]:arr}; setDaily(upd); saveMonth(null,upd,null); }
    else if(lastDeleted.type==="fixed" && lastDeleted.item){ const nf=[...fixedExpenses,lastDeleted.item]; setFixed(nf); saveMonth(nf,null,null); }
    setLastDeleted(null);
  };
  const togglePaid = id=>{ const upd={...paidFixed,[id]:!paidFixed[id]}; setPaid(upd); saveMonth(null,null,upd); };
  const saveIncome    = v=>{ const n=Number(v); if(!isNaN(n)&&n>0){setIncome(n);saveConfig(n,null);} };
  const saveGoal      = v=>{ const n=Number(v); if(!isNaN(n)&&n>=0){setSavingGoal(n);saveConfig(null,n);} };
  const saveBudget = v=>{ const n=Number(v); if(!isNaN(n)&&n>=0){setMonthlyBudget(n); const data={income,savingGoal,monthlyBudget:n,_updatedAt:Date.now()}; lsSet("raijai_config",data); queueCloudSave("raijai_config",data);} };
  const saveFixedAmt  = (id,v)=>{ const nf=fixedExpenses.map(e=>e.id===id?{...e,amount:Number(v)}:e); setFixed(nf); saveMonth(nf,null,null); };
  const saveFixedName = (id,v)=>{ const nf=fixedExpenses.map(e=>e.id===id?{...e,name:v}:e); setFixed(nf); saveMonth(nf,null,null); };
  const saveDailyName = (day,idx,v)=>{ const upd={...dailyEntries,[day]:dailyEntries[day].map((it,i)=>i===idx?{...it,name:v}:it)}; setDaily(upd); saveMonth(null,upd,null); };
  const saveDailyCategory = (day,idx,v)=>{ const upd={...dailyEntries,[day]:dailyEntries[day].map((it,i)=>i===idx?{...it,category:v}:it)}; setDaily(upd); saveMonth(null,upd,null); };
  const saveDailyAmt  = (day,idx,v)=>{ const upd={...dailyEntries,[day]:dailyEntries[day].map((it,i)=>i===idx?{...it,amount:Number(v)}:it)}; setDaily(upd); saveMonth(null,upd,null); };

  const days = daysInMonth(year,month);
  const todayDay = now.getMonth()+1===month&&now.getFullYear()===year?now.getDate():null;

  // Overview — แต่ละเดือนใช้ fixed ของตัวเอง
  const ovStats = Array.from({length:12},(_,i)=>{
    const k=mk(ovYear,i+1);
    const d=allMonthData[k]||{fixedExpenses:[],daily:{}};
    const fx=(d.fixedExpenses||[]).reduce((s,e)=>s+e.amount,0);
    const varExp=Object.values(d.daily||{}).flat().reduce((s,it)=>s+Number(it.amount),0);
    const total=fx+varExp;
    return {month:i+1,fx,varExp,total,savings:income-total,hasData:varExp>0||fx>0};
  });
  const activeMonths = ovStats.filter(m=>m.hasData);
  const ovTotalExp = activeMonths.reduce((s,m)=>s+m.total,0);
  const ovTotalInc = activeMonths.length*income;
  const ovTotalSav = ovTotalInc-ovTotalExp;
  // รวมรายจ่ายประจำของทั้งปีจากข้อมูลจริงของแต่ละเดือน
  // ไม่ใช้จำนวนของเดือนปัจจุบันคูณ 12 เพราะรายจ่ายประจำแต่ละเดือนแยกอิสระจากกัน
  const annualFixedTotal = ovStats.reduce((sum,m)=>sum+m.fx,0);
  const annualFixedByItem = {};
  ovStats.forEach(ms=>{
    const d=allMonthData[mk(ovYear,ms.month)]||{fixedExpenses:[]};
    (d.fixedExpenses||[]).forEach(e=>{
      // รวมรายจ่ายประจำที่ "ชื่อเหมือนกัน" เข้าด้วยกัน แม้ id จะต่างกันในแต่ละเดือน
      const itemName = String(e.name||"").trim();
      const key = `name:${itemName.toLowerCase().replace(/\s+/g," ")}`;
      if(!annualFixedByItem[key]) annualFixedByItem[key]={name:itemName,total:0,months:0};
      annualFixedByItem[key].total += Number(e.amount)||0;
      annualFixedByItem[key].months += 1;
    });
  });
  const annualFixedItems = Object.values(annualFixedByItem).sort((a,b)=>b.total-a.total);
  
  const highestMonth = activeMonths.length ? activeMonths.reduce((a,b)=>b.total>a.total?b:a) : null;
  const annualVarTotal = ovStats.reduce((sum,m)=>sum+m.varExp,0);
  const categoryTotals = {};
  activeMonths.forEach(ms=>{
    const d=allMonthData[mk(ovYear,ms.month)]||{daily:{}};
    Object.values(d.daily||{}).flat().forEach(it=>{ const c=it.category||"📦 อื่น ๆ"; categoryTotals[c]=(categoryTotals[c]||0)+Number(it.amount||0); });
  });
  const annualCategories = Object.entries(categoryTotals).sort((a,b)=>b[1]-a[1]);
  const currentMonthItems = Object.values(dailyEntries).flat();
  const matchesFilter = it=>{ const q=searchTerm.trim().toLowerCase(); return (!q || String(it.name||"").toLowerCase().includes(q) || String(it.note||"").toLowerCase().includes(q)) && (!filterCategory || (it.category||"📦 อื่น ๆ")===filterCategory); };
  const filteredItems = currentMonthItems.filter(matchesFilter);
  const compareMonth = activeMonths.length ? activeMonths[activeMonths.length-1].month : month;
  const compareYear = ovYear;
  const prevM = compareMonth===1?12:compareMonth-1, prevY=compareMonth===1?compareYear-1:compareYear;
  const compareData = allMonthData[mk(compareYear,compareMonth)]||{fixedExpenses:[],daily:{}};
  const compareTotal = (compareData.fixedExpenses||[]).reduce((a,e)=>a+Number(e.amount||0),0)+Object.values(compareData.daily||{}).flat().reduce((a,e)=>a+Number(e.amount||0),0);
  const prevData = lsGet(mk(prevY,prevM))||allMonthData[mk(prevY,prevM)]||{fixedExpenses:[],daily:{}};
  const prevTotal = (prevData.fixedExpenses||[]).reduce((a,e)=>a+Number(e.amount||0),0)+Object.values(prevData.daily||{}).flat().reduce((a,e)=>a+Number(e.amount||0),0);
  const monthDiff = compareTotal-prevTotal;
  const monthDiffPct = prevTotal>0 ? (monthDiff/prevTotal)*100 : null;

  return (<>
    <style>{css}</style>
    <div className="app">
      {/* ═══ MONTH TAB ═══ */}
      {tab==="month"&&(<>
        <div className="header">
          <div className="header-top">
            <span className="header-title">💰 บันทึกรายจ่าย</span>
            <button className="add-btn" onClick={()=>{setModal(true);setModalTab("daily");}}>+ เพิ่มรายจ่าย</button>
          </div>
          <div className="main-nav" aria-label="เมนูหลัก">
            <button title="รายเดือน" className={`nav-btn${tab==="month"?" active":""}`} onClick={()=>setTab("month")}><span className="nav-icon">📅</span><span className="nav-label">รายเดือน</span></button>
            <button title="ภาพรวม" className={`nav-btn${tab==="overview"?" active":""}`} onClick={()=>setTab("overview")}><span className="nav-icon">📊</span><span className="nav-label">ภาพรวม</span></button>
          </div>
          <div className="month-nav">
            <button className="month-btn" onClick={prevMonth}>‹</button>
            <div className="month-label">{MONTH_FULL[month-1]} {year}</div>
            <button className="month-btn" onClick={nextMonth}>›</button>
          </div>
          <div className="income-row">
            เงินเดือน:&nbsp;
            <Editable value={income} onSave={saveIncome} prefix="฿" style={{color:"rgba(255,255,255,0.9)",fontSize:13,fontWeight:600}}/>
            <span style={{fontSize:11,opacity:.45,marginLeft:4}}>(แตะแก้ไข)</span>
          </div>
        </div>

        <div className="cards-row">
          <div className="balance-card">
            <div style={{fontSize:12,fontWeight:700,color:"#D1FAE5",marginBottom:8}}>📌 งบใช้จ่ายเดือนนี้</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
              <div style={{fontSize:22,fontWeight:800,color:budgetRemaining<0?"#FCA5A5":"#fff"}}>฿{fmt(Math.abs(budgetRemaining))}{budgetRemaining<0&&" เกิน"}</div>
              <Editable value={monthlyBudget} onSave={saveBudget} prefix="฿" style={{fontSize:11,color:"#D1FAE5"}}/>
            </div>
            <div style={{fontSize:10,color:"#D1FAE5",marginBottom:7}}>เหลือจากงบ ฿{fmt(monthlyBudget)} · ใช้ไป {budgetPct.toFixed(0)}%</div>
            <div className="progress-bar" style={{background:"rgba(255,255,255,.15)",marginBottom:10}}><div className="progress-fill" style={{width:`${Math.min(100,budgetPct)}%`,background:budgetPct>100?"#FCA5A5":budgetPct>=80?"#FBBF24":"#B7E4C7"}}/></div>
            <div className="balance-label">💵 เงินคงเหลือที่จ่ายได้อีก</div>
            <div className="balance-amount" style={{color:remaining<0?"#FCA5A5":"#fff"}}>
              ฿{fmt(Math.abs(remaining))}{remaining<0&&<span style={{fontSize:14,marginLeft:6}}>⚠️ เกินงบ</span>}
            </div>
            <div className="balance-sub">รายได้ ฿{fmt(income)} − รายจ่าย ฿{fmt(totalExp)}</div>
            <div className="balance-row">
              <div className="balance-mini"><div className="bm-label">รายจ่ายคงที่</div><div className="bm-val">฿{fmt(totalFixed)}</div></div>
              <div className="balance-mini"><div className="bm-label">รายวัน</div><div className="bm-val">฿{fmt(totalVar)}</div></div>
              <div className="balance-mini">
                <div className="bm-label">งบรายวันเหลือ</div>
                <div className="bm-val" style={{color:varBudget-totalVar<0?"#FCA5A5":"#fff"}}>฿{fmt(varBudget-totalVar)}</div>
              </div>
            </div>
          </div>

          <div className="goal-card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:13,fontWeight:700,color:"#1B4332"}}>🏦 เก็บออม</span>
              <span style={{fontSize:11,color:"#9CA3AF"}}>แตะแก้ไข</span>
            </div>
            <div className="goal-row">
              <div className="goal-icon">🎯</div>
              <div className="goal-info">
                <div className="goal-saved">฿{fmt(savings)}</div>
                <div className="goal-target">เป้า&nbsp;<Editable value={savingGoal} onSave={saveGoal} prefix="฿" style={{fontSize:12,color:"#9CA3AF",fontWeight:600}}/>&nbsp;/ เดือน</div>
              </div>
              <div style={{fontSize:13,fontWeight:700,color:"#1B4332"}}>{goalPct.toFixed(0)}%</div>
            </div>
            <div className="progress-bar">
              <div className="progress-fill" style={{width:`${goalPct}%`,background:goalPct>=100?"#059669":goalPct>=60?"#1B4332":"#D97706"}}/>
            </div>
            <div style={{fontSize:11,color:"#9CA3AF",marginTop:5}}>
              {savings>=savingGoal?`✅ ถึงเป้า! เกิน ฿${fmt(savings-savingGoal)}`:`ขาดอีก ฿${fmt(savingGoal-savings)}`}
            </div>
          </div>
        </div>

        {/* Fixed */}
        <div className="section" style={{marginTop:18}}>
          <div className="section-header">
            <span className="section-title">รายจ่ายประจำเดือนนี้</span>
            <button className="sm-btn" onClick={()=>{setModal(true);setModalTab("fixed");}}>+ เพิ่ม</button>
          </div>
          {isNewMonth&&(
            <div className="notice">
              <span>📋</span>
              <span>copy รายการจากเดือนก่อนมาให้แล้ว แก้ไข เพิ่ม หรือลบได้เลย ไม่กระทบเดือนอื่น</span>
            </div>
          )}
          <div className="list-box">
            {fixedExpenses.map(e=>(
              <div className="fixed-item" key={e.id}>
                <input type="checkbox" className="fx-check" checked={!!paidFixed[e.id]} onChange={()=>togglePaid(e.id)}/>
                <span className="fx-name" style={{textDecoration:paidFixed[e.id]?"line-through":"none",opacity:paidFixed[e.id]?.5:1}}>
                  <Editable value={e.name} onSave={v=>saveFixedName(e.id,v)} isText style={{fontSize:14,fontWeight:500,color:"#374151"}}/>
                </span>
                <span className="fx-amt">
                  <Editable value={e.amount} onSave={v=>saveFixedAmt(e.id,v)} prefix="฿" style={{fontSize:14,fontWeight:600,color:"#1B4332"}}/>
                </span>
                <button className="icon-del" onClick={()=>delFixed(e.id)}>×</button>
              </div>
            ))}
            <div className="list-footer">
              <span style={{fontSize:13,color:"#6B7280"}}>รวม</span>
              <span style={{fontSize:15,fontWeight:700,color:"#1B4332"}}>฿{fmt(totalFixed)}</span>
            </div>
          </div>
          <p className="hint">แก้ไขได้อิสระ ไม่กระทบเดือนอื่น</p>
        </div>

        {/* Daily */}
        <div className="section" style={{marginTop:16}}>
          <div className="section-header">
            <span className="section-title">รายจ่ายรายวัน</span>
            <span style={{fontSize:13,color:"#6B7280"}}>฿{fmt(totalVar)}</span>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
            <input className="form-input" style={{flex:"1 1 180px",padding:"8px 10px"}} value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="🔎 ค้นหารายการ / หมายเหตุ"/>
            <select className="form-input" style={{flex:"0 1 180px",padding:"8px 10px"}} value={filterCategory} onChange={e=>setFilterCategory(e.target.value)}><option value="">ทุกหมวดหมู่</option>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select>
          </div>
          {lastDeleted&&<div className="notice" style={{justifyContent:"space-between"}}><span>ลบรายการแล้ว</span><button className="sm-btn" onClick={undoDelete}>↩️ ยกเลิกการลบ</button></div>}
          <div className="list-box">
            {Array.from({length:days},(_,i)=>i+1).filter(d=>(dailyEntries[String(d)]||[]).some(matchesFilter)).map(d=>{
              const items=dailyEntries[String(d)]||[];
              const dt=items.reduce((s,i)=>s+Number(i.amount),0);
              const isOpen=expDay===String(d);
              return (
                <div className="day-row" key={d}>
                  <div className="day-header" onClick={()=>setExpDay(isOpen?null:String(d))}>
                    <div className={`day-num${d===todayDay?" today-n":""}`}>{d}</div>
                    <span className="day-lbl">{MONTH_SHORT[month-1]} · {items.length} รายการ</span>
                    <span className="day-ttl">฿{fmt(dt)}</span>
                    <span className={`chevron${isOpen?" open":""}`}>▶</span>
                  </div>
                  {isOpen&&(
                    <div className="day-items-wrap">
                      {items.map((it,idx)=>({it,idx})).filter(x=>matchesFilter(x.it)).map(({it,idx})=>(
                        <div className="day-item" key={it.id||idx} style={{alignItems:"flex-start"}}>
                          <span className="di-name">
                            <Editable value={it.name} onSave={v=>saveDailyName(String(d),idx,v)} isText style={{fontSize:13,color:"#374151",fontWeight:600}}/>
                            <div style={{display:"flex",alignItems:"center",gap:5,marginTop:2}}><select value={it.category||"📦 อื่น ๆ"} onChange={e=>saveDailyCategory(String(d),idx,e.target.value)} style={{border:0,background:"transparent",fontSize:10,color:"#9CA3AF",padding:0}}>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select>{it.note&&<span style={{fontSize:10,color:"#9CA3AF"}}>· {it.note}</span>}</div>
                          </span>
                          <span style={{display:"flex",alignItems:"center",gap:6}}>
                            <span className="di-amt"><Editable value={it.amount} onSave={v=>saveDailyAmt(String(d),idx,v)} prefix="฿" style={{fontSize:13,fontWeight:500,color:"#374151"}}/></span>
                            <button className="icon-del" title="ทำซ้ำ" onClick={()=>duplicateDaily(String(d),idx)}>⧉</button>
                            <button className="icon-del" title="ลบ" onClick={()=>delDaily(String(d),idx)}>×</button>
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
            {!Object.keys(dailyEntries).filter(d=>dailyEntries[d]?.length).length&&
              <div className="empty-box">ยังไม่มีรายจ่ายรายวัน<br/>กด "+ เพิ่มรายจ่าย" เพื่อบันทึก</div>}
          </div>
          <p className="hint">แตะชื่อ/ตัวเลข เพื่อแก้ไข</p>
        </div>
      </>)}

      {/* ═══ OVERVIEW TAB ═══ */}
      {tab==="overview"&&(<>
        <div className="ov-header">
          <div className="main-nav" aria-label="เมนูหลัก">
            <button title="รายเดือน" className={`nav-btn${tab==="month"?" active":""}`} onClick={()=>setTab("month")}><span className="nav-icon">📅</span><span className="nav-label">รายเดือน</span></button>
            <button title="ภาพรวม" className={`nav-btn${tab==="overview"?" active":""}`} onClick={()=>setTab("overview")}><span className="nav-icon">📊</span><span className="nav-label">ภาพรวม</span></button>
          </div>
          <div className="month-nav" style={{marginBottom:4}}>
            <button className="month-btn" onClick={()=>setOvYear(y=>y-1)}>‹</button>
            <div className="month-label">ภาพรวมปี {ovYear}</div>
            <button className="month-btn" onClick={()=>setOvYear(y=>y+1)}>›</button>
          </div>
          <div style={{color:"#B7E4C7",fontSize:13}}>{activeMonths.length>0?`มีข้อมูล ${activeMonths.length} เดือน`:"ยังไม่มีข้อมูล"}</div>
        </div>

        <div className="ov-cards">
          <div className="ov-card">
            <div className="ov-clabel">💸 รายจ่ายรวมปี {ovYear}</div>
            <div className="ov-camt">฿{fmt(ovTotalExp)}</div>
            <div className="ov-csub">จากข้อมูล {activeMonths.length} เดือน</div>
          </div>
          <div className="ov-card">
            <div className="ov-clabel">📊 เฉลี่ยรายจ่าย / เดือน</div>
            <div className="ov-camt">฿{activeMonths.length?fmt(ovTotalExp/activeMonths.length):"0.00"}</div>
            <div className="ov-csub">เฉพาะเดือนที่มีข้อมูล</div>
          </div>
          <div className="ov-card">
            <div className="ov-clabel">🏠 รายจ่ายประจำรวมปี</div>
            <div className="ov-camt">฿{fmt(annualFixedTotal)}</div>
            <div className="ov-csub">รายจ่ายประจำจริงของแต่ละเดือน</div>
          </div>
          <div className="ov-card">
            <div className="ov-clabel">🛒 รายจ่ายรายวันรวมปี</div>
            <div className="ov-camt">฿{fmt(annualVarTotal)}</div>
            <div className="ov-csub">ค่าใช้จ่ายที่บันทึกรายวัน</div>
          </div>
          <div className="ov-card full">
            <div className="ov-clabel">🔥 เดือนที่ใช้เงินสูงสุด</div>
            {highestMonth ? <>
              <div className="ov-camt">{MONTH_FULL[highestMonth.month-1]} {ovYear} · ฿{fmt(highestMonth.total)}</div>
              <div className="ov-csub">รายจ่ายประจำ ฿{fmt(highestMonth.fx)} + รายจ่ายรายวัน ฿{fmt(highestMonth.varExp)}</div>
            </> : <div className="ov-csub">ยังไม่มีข้อมูล</div>}
          </div>
          <div className="ov-card full">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:14,fontWeight:700,color:"#1B4332"}}>💰 ภาพรวมการใช้เงินรายเดือน</span>
              <span style={{fontSize:12,color:"#6B7280"}}>กดเดือนเพื่อดูรายละเอียด</span>
            </div>
            <div className="list-box" style={{boxShadow:"none",border:"1px solid #F3F4F6"}}>
              <table className="month-table">
                <thead><tr><th>เดือน</th><th style={{textAlign:"right"}}>ประจำ</th><th style={{textAlign:"right"}}>รายวัน</th><th style={{textAlign:"right"}}>รวม</th><th style={{textAlign:"right"}}>เหลือ</th></tr></thead>
                <tbody>
                  {ovStats.filter(m=>m.hasData).map(ms=>(
                    <tr key={ms.month} onClick={()=>{setMonth(ms.month);setYear(ovYear);setTab("month");}}>
                      <td><span className={`mbadge${ms.month===month&&ovYear===year?" active":""}`}>{MONTH_SHORT[ms.month-1]}</span></td>
                      <td className="num">฿{fmt(ms.fx)}</td>
                      <td className="num">฿{fmt(ms.varExp)}</td>
                      <td className="num">฿{fmt(ms.total)}</td>
                      <td className={`num${ms.savings<0?" neg":" pos"}`}>{ms.savings>=0?"+":""}฿{fmt(ms.savings)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div className="section" style={{marginTop:16}}>
          <div className="section-header"><span className="section-title">📈 เดือนล่าสุดที่มีข้อมูลเทียบเดือนก่อน</span></div>
          <div className="list-box" style={{padding:"14px"}}>
            {monthDiffPct===null ? <div style={{fontSize:13,color:"#6B7280"}}>ยังไม่มีข้อมูลเดือนก่อนสำหรับเปรียบเทียบ</div> : <div style={{fontSize:14,color:monthDiff>0?"#B91C1C":"#047857",fontWeight:700}}>{monthDiff>0?"🔴":"🟢"} {monthDiff>0?"ใช้มากขึ้น":"ใช้ลดลง"} ฿{fmt(Math.abs(monthDiff))} ({Math.abs(monthDiffPct).toFixed(1)}%) <span style={{fontWeight:400,color:"#6B7280"}}>เทียบกับ {MONTH_FULL[prevM-1]} {prevY}</span></div>}
          </div>
        </div>

        <div className="section" style={{marginTop:16}}>
          <div className="section-header"><span className="section-title">🏷️ รายจ่ายรายวันแยกตามหมวดหมู่</span><span style={{fontSize:12,color:"#6B7280"}}>ทั้งปี</span></div>
          <div className="list-box">{annualCategories.length?annualCategories.map(([c,v])=><div className="fixed-item" key={c}><span className="fx-name">{c}</span><span className="fx-amt">฿{fmt(v)}</span></div>):<div className="empty-box">ยังไม่มีข้อมูลหมวดหมู่</div>}</div>
        </div>

        <div className="section" style={{marginTop:16}}>
          <div className="section-header">
            <span className="section-title">📋 รายจ่ายประจำแยกตามรายการ</span>
            <span style={{fontSize:14,fontWeight:700,color:"#1B4332"}}>฿{fmt(annualFixedTotal)} / ปี</span>
          </div>
          <div className="list-box">
            {annualFixedItems.length>0 ? <>
              <div style={{padding:"10px 14px",background:"#F0FDF4",borderBottom:"1px solid #D1FAE5",fontSize:12,color:"#6B7280"}}>
                รวมยอดจากแต่ละเดือนจริง — ถ้าบางเดือนไม่มีรายการ จะไม่นับเดือนนั้น
              </div>
              {annualFixedItems.map((e,i)=>(
                <div className="fixed-item" key={i}>
                  <span className="fx-name">{e.name}</span>
                  <span style={{fontSize:11,color:"#9CA3AF",marginLeft:"auto",marginRight:10}}>{e.months} เดือน</span>
                  <span className="fx-amt">฿{fmt(e.total)}</span>
                </div>
              ))}
              <div className="list-footer">
                <span style={{fontSize:13,color:"#6B7280"}}>รวมรายจ่ายประจำปี</span>
                <span style={{fontSize:15,fontWeight:700,color:"#1B4332"}}>฿{fmt(annualFixedTotal)}</span>
              </div>
            </> : <div className="empty-box">ยังไม่มีรายจ่ายประจำในปี {ovYear}</div>}
          </div>
        </div>

        
        {!activeMonths.length&&<div className="section" style={{marginTop:20}}><div className="list-box"><div className="empty-box">ยังไม่มีข้อมูลในปี {ovYear}<br/>เริ่มบันทึกในแท็บ "รายเดือน" ได้เลยครับ</div></div></div>}
      </>)}

      <div className="sync-panel">
        <div className="sync-title">☁️ Google Sync — ใช้ข้อมูลเดียวกันบน PC และมือถือ</div>
        <div className="sync-desc">วาง URL ของ Google Apps Script Web App (ลงท้าย /exec) ครั้งเดียวต่ออุปกรณ์ หลังจากนั้นการแก้ข้อมูลจะอัปขึ้นคลาวด์อัตโนมัติ</div>
        <div className="sync-row">
          <input className="sync-input" value={syncUrl} onChange={e=>setSyncUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec"/>
          <button className="backup-btn" style={{flex:"0 0 auto"}} onClick={saveSyncUrl}>บันทึก URL</button>
          <button className="backup-btn" style={{flex:"0 0 auto"}} disabled={syncBusy} onClick={()=>syncNow()}>{syncBusy?"กำลังซิงก์…":"🔄 ซิงก์ตอนนี้"}</button>
        </div>
        {syncStatus&&<div className={`sync-status${syncStatus.startsWith("✅")?" ok":syncStatus.startsWith("❌")?" err":""}`}>{syncStatus}</div>}
      </div>

      <div className="backup-row">
        <button className="backup-btn" onClick={exportBackup}>⬇️ Export / สำรองข้อมูล</button>
        <label className="backup-btn" style={{textAlign:"center"}}>⬆️ Import / กู้คืนข้อมูล<input type="file" accept="application/json,.json" style={{display:"none"}} onChange={e=>{importBackup(e.target.files[0]);e.target.value="";}}/></label>
      </div>

    </div>

    {modal&&(
      <div className="overlay" onClick={e=>e.target.className==="overlay"&&setModal(null)}>
        <div className="modal">
          <div className="modal-title">เพิ่มรายจ่าย</div><button className="modal-close" aria-label="ปิด" title="ปิด" onClick={()=>setModal(null)}>×</button>
          <div className="modal-tabs">
            <button className={`modal-tab${modalTab==="daily"?" active":""}`} onClick={()=>setModalTab("daily")}>รายวัน</button>
            <button className={`modal-tab${modalTab==="fixed"?" active":""}`} onClick={()=>setModalTab("fixed")}>ประจำเดือน</button>
          </div>
          {modalTab==="daily"?(<>
            <div className="form-group"><label className="form-label">วันที่</label><input className="form-input" type="number" min="1" max={days} value={fDay} onChange={e=>setFDay(e.target.value)}/></div>
            <div className="form-group"><label className="form-label">รายการ</label><input className="form-input" type="text" value={fName} onChange={e=>setFName(e.target.value)} placeholder="เช่น ข้าวมันไก่, ชา…" ref={dailyNameRef}/></div>
            <div className="form-group"><label className="form-label">จำนวนเงิน (฿)</label><input className="form-input" type="number" value={fAmt} onChange={e=>setFAmt(e.target.value)} placeholder="0" onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();addDaily();}}}/></div>
            <div className="form-group"><label className="form-label">หมวดหมู่</label><select className="form-input" value={fCategory} onChange={e=>setFCategory(e.target.value)}>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="form-group"><label className="form-label">หมายเหตุ (ไม่บังคับ)</label><input className="form-input" type="text" value={fNote} onChange={e=>setFNote(e.target.value)} placeholder="เช่น โปร 1 แถม 1, ซื้อเข้าบ้าน…"/></div>
            <div className="btn-row"><button className="btn-cancel" onClick={()=>setModal(null)}>ยกเลิก</button><button className="btn-primary" onClick={addDaily}>บันทึก</button></div>
          </>):(<>
            <div className="form-group"><label className="form-label">ชื่อรายจ่าย</label><input className="form-input" type="text" value={fxName} onChange={e=>setFxName(e.target.value)} placeholder="เช่น Netflix, ค่าน้ำ…"/></div>
            <div className="form-group"><label className="form-label">จำนวนเงิน (฿)</label><input className="form-input" type="number" value={fxAmt} onChange={e=>setFxAmt(e.target.value)} placeholder="0"/></div>
            <div className="btn-row"><button className="btn-cancel" onClick={()=>setModal(null)}>ยกเลิก</button><button className="btn-primary" onClick={addFixed}>เพิ่ม</button></div>
          </>)}
        </div>
      </div>
    )}
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
